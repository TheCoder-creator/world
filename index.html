<!DOCTYPE html>
<html lang="en-US">

<head>
    <base href="https://cdn.jsdelivr.net/gh/marty-games/mga-unity@main/geometry-dash-world/">

    <title>Geometry Dash World</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        html {
            box-sizing: border-box;
        }

        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(#000000, #0066ff);
            font-family: Arial, sans-serif;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #loader {
            position: absolute;
            inset: 0;
            background: linear-gradient(#000000, #0066ff);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            z-index: 10;
        }

        .spinner {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 8px solid rgba(255,255,255,0.2);
            border-top: 8px solid white;
            animation: spin 1s linear infinite;
            margin-top: 20px;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        #hz-address {
            position: fixed;
            bottom: 15px;
            left: 15px;
            background: rgba(0,0,0,0.7);
            color: #00eb84;
            border: 1px solid #00eb84;
            padding: 8px 14px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 12px;
            z-index: 9999;
        }
    </style>
</head>

<body>

<div id="loader">
    <h1>Geometry Dash World</h1>
    <div class="spinner"></div>
</div>

<div id="gameContainer"></div>

<div id="hz-address">
    Loading Address...
</div>

<script>
const SUPABASE_URL = 'https://xlisbmtenekjmundxbcn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Cvs-AiKPTHrC_tfGfwlpSQ_4Hir5Cva';

async function initHorizenBlocker() {

    let address = localStorage.getItem('horizen_address');

    if (!address) {

        const digits = Math.floor(100000 + Math.random() * 900000);

        address = `horizen.play://${digits}`;

        localStorage.setItem('horizen_address', address);

        try {
            await fetch(`${SUPABASE_URL}/rest/v1/users`, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify({
                    address: address,
                    nickname: 'Unknown',
                    is_blocked: false
                })
            });
        } catch(e) {}
    }

    document.getElementById('hz-address').innerText = address;

    try {

        const res = await fetch(
            `${SUPABASE_URL}/rest/v1/users?address=eq.${encodeURIComponent(address)}&select=is_blocked`,
            {
                headers: {
                    'apikey': SUPABASE_KEY
                }
            }
        );

        const data = await res.json();

        if (data.length > 0 && data[0].is_blocked === true) {

            window.location.href = "https://blocked.horizensearch.com";

            return false;
        }

    } catch(e) {}

    return true;
}

async function startGame() {

    const allowed = await initHorizenBlocker();

    if (!allowed) return;

    const iframe = document.createElement('iframe');

    iframe.src = "https://marty-games.github.io/mga-unity/geometry-dash-world/";

    document.getElementById('gameContainer').appendChild(iframe);

    document.getElementById('loader').style.display = "none";
}

startGame();
</script>

</body>
</html>
